name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Patch deployed interface
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_nav = '<button id="prev" class="btn">‹ Dagur</button><button id="todayBtn" class="btn primary">Í dag</button><button id="next" class="btn">Dagur ›</button><input id="date" class="text" type="date"><span id="dateLabel" class="date-label"></span>'
          new_nav = '<button id="prev" class="btn">‹ Dagur</button><button id="todayBtn" class="btn primary">Mánudagur</button><button id="next" class="btn">Dagur ›</button><input id="date" class="text" type="date">'
          s = s.replace(old_nav, new_nav)
          old_render = "function renderToday(){date.value=current;dateLabel.textContent=pretty(current);const host=todayHost,"
          new_render = "function renderToday(){date.value=current;todayBtn.textContent=days[dayIndex(current)];todayBtn.classList.toggle('primary',current===todayIso());const host=todayHost,"
          s = s.replace(old_render, new_render)
          s = s.replace('<button id="prevLesson" class="btn arrow" ${manualLessonIndex===0?\'disabled\':\'\'}>←</button>', '<button id="prevLesson" class="btn arrow" ${manualLessonIndex===0?\'disabled\':\'\'}>← <span style="font-size:14px">Síðasti tími</span></button>')
          s = s.replace('<button id="nextLesson" class="btn arrow" ${manualLessonIndex===lessons.length-1?\'disabled\':\'\'}>→</button>', '<button id="nextLesson" class="btn arrow" ${manualLessonIndex===lessons.length-1?\'disabled\':\'\'}><span style="font-size:14px">Næsti tími</span> →</button>')
          s = s.replace('.lesson-nav .arrow{width:48px;height:48px;border-radius:14px;font-size:24px}', '.lesson-nav .arrow{min-width:135px;height:48px;border-radius:14px;font-size:22px;display:flex;align-items:center;justify-content:center;gap:8px}')
          sorter = '''<script>
          (()=>{
            const collator=new Intl.Collator('is',{sensitivity:'base'});
            function sortDailyStudents(){
              const tbody=document.querySelector('#todayHost table.tbl tbody');
              if(!tbody)return;
              const rows=[...tbody.querySelectorAll(':scope > tr')];
              const sorted=[...rows].sort((a,b)=>{
                const an=(a.cells[0]?.textContent||'').trim();
                const bn=(b.cells[0]?.textContent||'').trim();
                return collator.compare(an,bn);
              });
              const changed=rows.some((row,i)=>row!==sorted[i]);
              if(changed) sorted.forEach(row=>tbody.appendChild(row));
            }
            const host=document.getElementById('todayHost');
            if(host)new MutationObserver(()=>sortDailyStudents()).observe(host,{childList:true,subtree:true});
            const original=window.renderToday;
            if(typeof original==='function')window.renderToday=function(){const r=original.apply(this,arguments);requestAnimationFrame(sortDailyStudents);return r};
            sortDailyStudents();
          })();
          </script>'''
          s = s.replace('</body>', '<script src="force24.js?v=${{ github.sha }}"></script>'+sorter+'</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
