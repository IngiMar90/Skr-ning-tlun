name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Patch deployed interface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_nav = '<button id="prev" class="btn">‹ Dagur</button><button id="todayBtn" class="btn primary">Í dag</button><button id="next" class="btn">Dagur ›</button><input id="date" class="text" type="date"><span id="dateLabel" class="date-label"></span>'
          new_nav = '<button id="currentTimeBtn" class="btn primary">Núverandi tími</button><button id="prev" class="btn">‹ Dagur</button><button id="todayBtn" class="btn primary">Mánudagur</button><button id="next" class="btn">Dagur ›</button><input id="date" class="text" type="date">'
          s = s.replace(old_nav, new_nav)

          old_render = "function renderToday(){date.value=current;dateLabel.textContent=pretty(current);const host=todayHost,"
          new_render = "function renderToday(){date.value=current;todayBtn.textContent=days[dayIndex(current)];todayBtn.classList.toggle('primary',current===todayIso());const host=todayHost,"
          s = s.replace(old_render, new_render)

          s = s.replace('<button id="prevLesson" class="btn arrow" ${manualLessonIndex===0?\'disabled\':\'\'}>←</button>', '<button id="prevLesson" class="btn arrow" ${manualLessonIndex===0?\'disabled\':\'\'}>← <span style="font-size:14px">Síðasti tími</span></button>')
          s = s.replace('<button id="nextLesson" class="btn arrow" ${manualLessonIndex===lessons.length-1?\'disabled\':\'\'}>→</button>', '<button id="nextLesson" class="btn arrow" ${manualLessonIndex===lessons.length-1?\'disabled\':\'\'}><span style="font-size:14px">Næsti tími</span> →</button>')
          s = s.replace('.lesson-nav .arrow{width:48px;height:48px;border-radius:14px;font-size:24px}', '.lesson-nav .arrow{min-width:135px;height:48px;border-radius:14px;font-size:22px;display:flex;align-items:center;justify-content:center;gap:8px}')

          pwa_head = '''<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3559e0"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Námskráning"><link rel="icon" href="app-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.svg">'''
          if 'manifest.webmanifest' not in s:
              s = s.replace('</head>', pwa_head + '</head>', 1)

          extra_css = '''
          .share-app,.install-app{margin-top:18px;padding:18px 20px;display:flex;align-items:center;gap:20px}
          .share-app img,.install-app img{width:128px;height:128px;flex:0 0 auto;background:#fff;border-radius:12px;padding:7px;border:1px solid var(--line)}
          .share-app-copy,.install-app-copy{min-width:0}.share-app h3,.install-app h3{margin:0 0 6px}.share-app p,.install-app p{margin:0 0 10px;color:var(--muted);line-height:1.45}
          .app-url{display:inline-block;max-width:100%;overflow-wrap:anywhere;font-weight:800;color:var(--accent);text-decoration:none;padding:10px 12px;border-radius:10px;background:var(--soft)}
          .install-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.install-app .btn{min-height:48px;padding:12px 18px}
          .install-note{margin-top:10px!important;padding:10px 12px;border-radius:10px;background:#f8fafc;color:var(--text)!important}.install-note.hidden{display:none!important}
          .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.fullscreen-btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}.fullscreen-btn .fs-icon{font-size:18px;line-height:1}
          @media(max-width:700px){.share-app,.install-app{align-items:flex-start}.share-app img,.install-app img{width:108px;height:108px}.fullscreen-btn .fs-label{display:none}.fullscreen-btn{min-width:48px;padding:10px}}
          @media(max-width:500px){.share-app,.install-app{flex-direction:column;align-items:center;text-align:center}.share-app img,.install-app img{width:150px;height:150px}.app-url,.install-actions,.install-actions .btn{width:100%}}
          '''
          if '.install-app{' not in s:
              s = s.replace('</style>', extra_css + '</style>', 1)
          elif '.fullscreen-btn{' not in s:
              s = s.replace('</style>', extra_css + '</style>', 1)

          qr_panel = '''<div class="panel share-app"><img src="app-qr.svg?v=${{ github.sha }}" alt="QR-kóði sem opnar Námskráningu"><div class="share-app-copy"><h3>Opna í öðru tæki</h3><p>Skannaðu QR-kóðann með myndavél á síma eða spjaldtölvu, eða opnaðu slóðina beint.</p><a class="app-url" href="https://ingimar90.github.io/Skr-ning-tlun/" target="_blank" rel="noopener">ingimar90.github.io/Skr-ning-tlun/</a></div></div>'''

          install_panel = '''<div class="panel install-app"><img src="app-icon.svg" alt="Námskráning app-tákn"><div class="install-app-copy"><h3>Vista sem app</h3><p>Settu Námskráningu á heimaskjá spjaldtölvunnar eða símans og opnaðu hana síðan eins og venjulegt app.</p><div class="install-actions"><button id="installAppBtn" class="btn primary" type="button">Setja upp app</button></div><p id="installAppNote" class="install-note hidden"></p></div></div>'''

          if 'class="panel share-app"' not in s or 'class="panel install-app"' not in s:
              match = re.search(r'(<section id="home" class="view">.*?)(</section>\s*<section id="today")', s, flags=re.S)
              if not match:
                  raise RuntimeError('Could not locate home section for share/install panels')
              home = match.group(1)
              if 'class="panel share-app"' not in home:
                  home += qr_panel
              if 'class="panel install-app"' not in home:
                  home += install_panel
              replacement = home + match.group(2)
              s = s[:match.start()] + replacement + s[match.end():]

          sorter = '''<script>
          (()=>{
            const collator=new Intl.Collator('is',{sensitivity:'base'});
            function sortDailyStudents(){
              const tbody=document.querySelector('#todayHost table.tbl tbody');
              if(!tbody)return;
              const rows=[...tbody.querySelectorAll(':scope > tr')];
              const sorted=[...rows].sort((a,b)=>{
                const an=(a.cells[0]?.textContent||'').trim();
                const bn=(b.cells[0]?.textContent||'').trim();
                return collator.compare(an,bn);
              });
              const changed=rows.some((row,i)=>row!==sorted[i]);
              if(changed) sorted.forEach(row=>tbody.appendChild(row));
            }
            const host=document.getElementById('todayHost');
            if(host)new MutationObserver(()=>sortDailyStudents()).observe(host,{childList:true,subtree:true});
            const original=window.renderToday;
            if(typeof original==='function')window.renderToday=function(){const r=original.apply(this,arguments);requestAnimationFrame(sortDailyStudents);return r};
            sortDailyStudents();
          })();
          </script>'''

          installer = '''<script>
          (()=>{
            let deferredPrompt=null;
            const btn=document.getElementById('installAppBtn');
            const note=document.getElementById('installAppNote');
            const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
            const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

            if('serviceWorker' in navigator){
              window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
            }

            function showNote(html){
              if(!note)return;
              note.innerHTML=html;
              note.classList.remove('hidden');
            }

            if(!btn)return;

            if(standalone){
              btn.textContent='Appið er uppsett';
              btn.disabled=true;
              showNote('Þú ert nú þegar að nota Námskráningu sem uppsett app.');
              return;
            }

            if(isiOS){
              btn.textContent='Hvernig vista ég appið?';
              showNote('Á iPad/iPhone: opnaðu síðuna í Safari, ýttu á <strong>Deila</strong> ⬆ og veldu <strong>Bæta við heimaskjá</strong>.');
            }else{
              btn.disabled=false;
            }

            window.addEventListener('beforeinstallprompt',event=>{
              event.preventDefault();
              deferredPrompt=event;
              btn.disabled=false;
              btn.textContent='Setja upp app';
              showNote('Ýttu á <strong>Setja upp app</strong> til að bæta Námskráningu á heimaskjáinn.');
            });

            btn.addEventListener('click',async()=>{
              if(deferredPrompt){
                deferredPrompt.prompt();
                const choice=await deferredPrompt.userChoice;
                deferredPrompt=null;
                if(choice.outcome==='accepted'){
                  btn.textContent='Appið er uppsett';
                  btn.disabled=true;
                  showNote('Námskráning hefur verið sett upp og ætti nú að birtast meðal appanna þinna.');
                }
                return;
              }
              if(isiOS){
                showNote('Á iPad/iPhone: <strong>Safari → Deila ⬆ → Bæta við heimaskjá → Bæta við</strong>. Þá opnast Námskráning eins og venjulegt app.');
              }else{
                showNote('Ef uppsetningarglugginn birtist ekki skaltu opna valmynd vafrans (⋮) og velja <strong>Setja upp app</strong> eða <strong>Bæta við heimaskjá</strong>.');
              }
            });

            window.addEventListener('appinstalled',()=>{
              btn.textContent='Appið er uppsett';
              btn.disabled=true;
              showNote('Námskráning er nú uppsett á tækinu.');
            });
          })();
          </script>'''

          fullscreen = '''<script>
          (()=>{
            const topbar=document.querySelector('.topbar');
            if(!topbar || document.getElementById('fullscreenBtn')) return;

            let saveBadge=document.getElementById('save');
            let actions=document.createElement('div');
            actions.className='top-actions';

            const btn=document.createElement('button');
            btn.id='fullscreenBtn';
            btn.type='button';
            btn.className='btn fullscreen-btn';
            btn.innerHTML='<span class="fs-icon">⛶</span><span class="fs-label">Fullscreen</span>';
            btn.setAttribute('aria-label','Opna í fullscreen');
            btn.title='Opna í fullscreen';

            if(saveBadge){
              saveBadge.parentNode.insertBefore(actions,saveBadge);
              actions.appendChild(btn);
              actions.appendChild(saveBadge);
            }else{
              topbar.appendChild(actions);
              actions.appendChild(btn);
            }

            const fullscreenElement=()=>document.fullscreenElement || document.webkitFullscreenElement;
            const standalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;

            function refresh(){
              const active=!!fullscreenElement();
              btn.innerHTML=active?'<span class="fs-icon">⛶</span><span class="fs-label">Hætta fullscreen</span>':'<span class="fs-icon">⛶</span><span class="fs-label">Fullscreen</span>';
              btn.setAttribute('aria-label',active?'Hætta í fullscreen':'Opna í fullscreen');
              btn.title=active?'Hætta í fullscreen':'Opna í fullscreen';
            }

            async function enterFullscreen(){
              const root=document.documentElement;
              if(root.requestFullscreen) return root.requestFullscreen();
              if(root.webkitRequestFullscreen) return root.webkitRequestFullscreen();
              throw new Error('Fullscreen API ekki stutt');
            }

            async function leaveFullscreen(){
              if(document.exitFullscreen) return document.exitFullscreen();
              if(document.webkitExitFullscreen) return document.webkitExitFullscreen();
            }

            btn.addEventListener('click',async()=>{
              if(standalone()){
                alert('Þú ert þegar að nota uppsetta appið í app-ham. Þetta er fullscreen-líkasti hamurinn á þessu tæki.');
                return;
              }
              try{
                if(fullscreenElement()) await leaveFullscreen();
                else await enterFullscreen();
              }catch(err){
                alert('Þessi vafri leyfir ekki beinan fullscreen-ham. Á iPad/iPhone er best að velja „Bæta við heimaskjá“ og opna Námskráningu sem uppsett app.');
              }
              refresh();
            });

            document.addEventListener('fullscreenchange',refresh);
            document.addEventListener('webkitfullscreenchange',refresh);
            refresh();
          })();
          </script>'''

          current_time_nav = '''<script>
          (()=>{
            const btn=document.getElementById('currentTimeBtn');
            if(!btn)return;

            const style=document.createElement('style');
            style.textContent=`
              #currentTimeBtn{white-space:nowrap}
              @media(max-width:899px){
                .date-nav{grid-template-columns:repeat(4,minmax(0,1fr))!important}
                .date-nav #date{grid-column:1/-1!important}
              }
              @media(max-width:620px){
                .date-nav{grid-template-columns:1fr 1fr!important}
                .date-nav #date{grid-column:1/-1!important}
              }
            `;
            document.head.appendChild(style);

            btn.addEventListener('click',()=>{
              current=todayIso();
              const lessons=lessonsForCurrentDay();
              const runningIndex=lessons.findIndex(lesson=>isCurrentLesson(lesson,current));
              manualLessonIndex=runningIndex>=0?runningIndex:(lessons.length?defaultLessonIndex(lessons):0);
              renderToday();
            });
          })();
          </script>'''

          s = s.replace('</body>', '<script src="force24.js?v=${{ github.sha }}"></script>'+sorter+installer+fullscreen+current_time_nav+'</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
